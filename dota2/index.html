<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="/styles/global.css">
        <link rel="stylesheet" href="/styles/dota2.css">
        <link rel="stylesheet" href="/styles/themes.css">
        <title>zboxjpg</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="favicon" href="/favicon.ico">
        <link rel="preconnect" href="http://cdn.dota2.com">
    </head>
    <body>
        <div id="custom-scrollbar">
            <div id="scroll-thumb"></div>
        </div>
        <div id="background"></div>
        
        <div class="card" id="back">
            <span class="ui title">[ BACK ]</span>
            <span class="ui close-button">[ x ]</span>
            <a href="/">TO HELL AND BACK</a>
        </div>

        <div class="card" id="main">
            <span class="ui title">[ DOTA BUILD GENERATOR ]</span>
            <span class="ui close-button">[ x ]</span>

            <img id="random-item" alt="random-item">
            <span id="item-name">Eul's Scepter of Divinity</span>
            <input type="button" value="NEW ITEM" onclick="getRandomItem()">
        </div>

        <div class="card" id="themes">
            <span class="ui title">[ THEMES ]</span>
            <span class="ui close-button">[ x ]</span>

            <span class="select-theme" onclick="change_theme(this.textContent)">monokai</span>
            <span class="select-theme" onclick="change_theme(this.textContent)">gruber-darker</span>
            <span class="select-theme" onclick="change_theme(this.textContent)">ayu</span>
            <span class="select-theme" onclick="change_theme(this.textContent)">classic</span>
        </div>

        <div class="card" id="timer">
            <span class="ui title">[ TIMER ]</span>
            <span class="ui close-button">[ x ]</span>

            <span id="clock" style="font-size: 48px;">00:00:00</span>
        </div>
    </body>
    <script src="/scripts/dota2.js"></script>
    <script src="/scripts/mobile.js"></script>
    <script src="/scripts/bg.js"></script>
    <script src="/scripts/theme.js"></script>
    <script src="/scripts/timer.js"></script>
</html>
